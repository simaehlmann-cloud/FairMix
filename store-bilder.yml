name: Store-Bilder (Play, Lite)

# Nur von Hand: die Bilder aendern sich selten, und jeder Lauf laedt einen
# vollstaendigen Chromium herunter. Starten unter Actions ueber den Knopf
# "Run workflow".
on:
  workflow_dispatch:

jobs:
  bilder:
    runs-on: ubuntu-latest

    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Erzeugt lite/ mit umgelegtem Schalter, eigener Kennung und den
      # Lite-Symbolen. Die Bilder entstehen anschliessend in diesem Ordner,
      # damit "FairMix Lite" im Kopf steht und keine gesperrte Funktion
      # sichtbar ist.
      - name: Lite-Fassung erzeugen
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages Pillow || pip install --quiet Pillow
          chmod +x build-lite.sh
          ./build-lite.sh

      # store-bilder.js liegt nicht im Lite-Ordner, weil build-lite.sh nur
      # die App und die Pruefkette kopiert. Es wird deshalb dazugelegt.
      - name: Skript in den Lite-Ordner legen
        run: cp store-bilder.js lite/

      - name: Playwright einrichten
        run: |
          set -e
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Bilder erzeugen
        working-directory: lite
        run: node store-bilder.js --play

      # Ergebnis: store-bilder/play-play-phone-de/ und .../-en/ mit je sechs
      # Bildern zu 1080 x 1920. Das Skript bricht selbst ab, wenn ein Motiv
      # nicht aufgebaut wurde oder ein Mass nicht stimmt.
      - name: Bilder hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FairMix-lite-store-bilder
          path: lite/store-bilder/
          if-no-files-found: error
